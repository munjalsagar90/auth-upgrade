agentNetwork: 2.0.0
info:
    label: sap-upgrade
    version: v1
registry:
    mcps:
        updateSapConnectionUtil:
            info:
                label: Update SAP Connection Util
            metadata:
                transport:
                    kind: streamableHttp
                    path: /mcp1
    llms:
        openaiSapUpgrade:
            info:
                label: OpenAI - SAP Upgrade
                description: OpenAI LLM Provider for SAP Upgrade Agent Network
            metadata:
                platform: OpenAI
context:
    connections:
        updateSapConnectionUtilConnection:
            kind: mcp
            ref:
                name: updateSapConnectionUtil
            url: ${updateSapConnectionUtil.url}
        openaiConnection:
            kind: llm
            ref:
                name: openaiSapUpgrade
            url: https://api.openai.com/v1
            authentication:
                kind: apiKey
                apiKey: ${openaiSapUpgrade.apiKey}
brokers:
    sapUpgradeBroker:
        kind: AgentScript
        implementation: ./brokers/broker1.agent
        interfaces:
            a2a:
                card:
                    name: SAP Upgrade Broker
                    description: Upgrades SAP connection configuration in a GitHub repository from Application Server to Message Server format with Extended Properties, bumps the pom.xml patch version, creates a feature branch PR into develop, and adds a reviewer.
                    version: 1.0.0
                    capabilities:
                        streaming: true
                        pushNotifications: false
                    defaultInputModes:
                        - text/plain
                    defaultOutputModes:
                        - text/plain
                    skills:
                        - id: sap-upgrade-skill
                          name: SAP Connection Upgrade
                          description: Scans all XML files in src/main/mule/, upgrades sap:simple-connection-provider-connection to Message Server format, bumps pom.xml patch version, creates a PR from feature/update-sap-connection into develop, and adds the specified GitHub user as reviewer.
                          tags:
                              - sap
                              - upgrade
                              - github